[project]
name = "pandaplot"
version = "0.1.0"
description = "PandaPlot is educational scientific visualization and analysis application built with Python. The project is open source and welcomes contribution."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.10.3",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyside6>=6.11.2",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    # Needed by Nuitka/pyside6-deploy on macOS to convert the .ico app icon
    # to a native .icns; without it the deploy build fails.
    "imageio>=2.38.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "pytest-qt>=4.5.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
    "viztracer>=1.1.1",
    "vulture>=2.16",
]

[tool.pyside6-project]
files = ["pandaplot/app.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["pandaplot_storybook"]
# Run in parallel by default. `loadfile` keeps each test file on one worker because many GUI test
# modules share module-scoped Qt fixtures. Workers are capped because each one loads Qt and
# Matplotlib. Pass `-n 0` to run serially (needed for --pdb and IDE debuggers).
# `tests/xdist_crash_safe.py` replaces xdist's `loadfile` scheduler so a crashed worker cannot hang the
# run and the crashed test is not re-run.
addopts = "-n auto --maxprocesses=8 --dist=loadfile --max-worker-restart=1"
# A hung Qt test must fail instead of consuming the whole job. Covers setup, call and teardown;
# the slowest legitimate test (an e2e workflow) takes about 50s under load. The `thread` method
# dumps all stacks and kills the process, which also works when the hang is inside a native Qt
# call that a signal handler could not interrupt. xdist then reports the worker as crashed;
# `--max-worker-restart=1` allows one worker replacement across the whole session; a second
# worker crash triggers shutdown of the remaining workers and can leave pending tests unexecuted.
timeout = 120
timeout_method = "thread"
pythonpath = ["scripts/icons"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
# On top of the default `select` (`E4`, E7`, `E9`, and `F`), enable flake8-bugbear (`B`) and flake8-quotes (`Q`).
extend-select = ["B", "Q", "I", "FBT"]
