[project]
name = "pandaplot-storybook"
version = "0.1.0"
description = "Interactive PySide6 gallery for PandaPlot's reusable UI widgets, with live theme switching."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11.2",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = ["B", "Q", "I", "FBT"]
