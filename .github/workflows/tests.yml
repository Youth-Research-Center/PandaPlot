name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Run existing tests
        run: uv run pytest tests --ignore=tests/e2e --junitxml=test-results/unit.xml
      - name: Run GUI workflows
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: uv run pytest tests/e2e --junitxml=test-results/e2e.xml
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
