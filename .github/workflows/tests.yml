name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        run: uv sync --locked --group dev
      # Runs the unit, GUI and e2e tests in parallel (xdist settings live in pyproject.toml), so the
      # slow e2e file overlaps with the rest instead of running as a separate serial step.
      - name: Run tests
        run: uv run pytest tests --durations=25 --junitxml=test-results/pytest.xml
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
